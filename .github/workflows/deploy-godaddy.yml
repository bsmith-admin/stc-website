name: Deploy to GoDaddy

# Runs automatically on every push to master, and can also be triggered
# manually from the Actions tab in GitHub if you ever need to re-sync.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Sync site files to GoDaddy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: FTP deploy to GoDaddy public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          # Only the static site files get uploaded - the Visual Studio
          # project, git internals, and build output stay out of GoDaddy.
          exclude: |
            **/.git*
            **/.git*/**
            **/.vs/**
            **/stc-website-host/**
            **/*.slnx
            **/push.ps1
            **/README.md
